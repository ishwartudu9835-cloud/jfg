<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Cowartu Admin</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/media/favicon-32.png"><link rel="apple-touch-icon" href="/media/apple-touch-icon.png"><meta name="theme-color" content="#10223d">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--card:#fff;--ink:#14253f;--mu:#667286;--ln:#e8e1d4;--nv:#1c3557;--go:#f0a02b;--ok:#1d8a4f;--bad:#c62828;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Poppins,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Montserrat,sans-serif;margin:0}h1{font-size:1.5rem;margin-bottom:16px}h2{font-size:1.1rem;margin:26px 0 10px}h3{font-size:.95rem;margin:18px 0 8px}.mu,small{color:var(--mu);font-size:.8rem}small{display:block}
.top{position:sticky;top:0;z-index:20;background:var(--nv);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px}.top button{background:none;border:0;color:#fff;font-size:1.5rem}.top img,.lg img{width:34px;height:34px;border-radius:9px;background:#fff;padding:2px}
nav{display:none;background:var(--nv);padding:6px 10px 12px;position:sticky;top:54px;z-index:19}nav.o{display:block}nav a{display:block;color:#cfd8e8;padding:12px;border-radius:10px;cursor:pointer}nav a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
main{padding:18px 14px 60px;max-width:960px;margin:0 auto}.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sc,.cd,.row{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px}.sc b{font:800 1.4rem Montserrat;display:block;margin-top:2px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;cursor:pointer}.row:active{background:#faf6ee}.row b{display:block}
.b{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:99px;background:#eee;color:#444;white-space:nowrap}.b.approved,.b.success{background:#d9f3e4;color:var(--ok)}.b.rejected,.b.failed,.b.cancelled{background:#fde1e1;color:var(--bad)}.b.awaiting_approval,.b.payment_verification_pending,.b.pending{background:#fff0cf;color:#9a6200}.b.waiting_list{background:#e2e8f8;color:#33509a}
.bt,.ac button,.fm button{font:600 .85rem Poppins;border:0;border-radius:99px;padding:10px 16px;background:var(--go);color:#10223d;cursor:pointer;min-height:40px}.ac button{background:#eee;color:var(--ink)}.ac{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.bt.d{background:var(--bad);color:#fff}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}.fm{display:grid;gap:8px;margin:10px 0}.fl{display:grid;gap:8px;margin-bottom:12px}
.mo{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}.sh{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));position:relative}
.x{position:absolute;right:12px;top:10px;font-size:1.6rem;background:none;border:0;color:var(--mu)}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.kv span{word-break:break-word;font-weight:500}.pr{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--ln);background:#fff;border-radius:14px;padding:12px;margin-bottom:8px}.pr .ac{margin:0;align-content:start}
details{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:8px}summary{cursor:pointer;font-weight:600}.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--go)}
.lg{max-width:400px;margin:12vh auto;padding:0 16px}.lg .cd{padding:24px;text-align:center}.er{color:var(--bad);font-size:.85rem;min-height:1.3em;font-weight:600}
#inv{background:#fff;color:#111;padding:20px;border-radius:12px;border:1px solid var(--ln)}.ih{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.ih img{width:54px;height:54px}#inv table{width:100%;border-collapse:collapse;margin:16px 0}#inv th,#inv td{padding:9px;border-bottom:1px solid #ddd;text-align:left}#inv td:last-child,#inv th:last-child{text-align:right}.tt div{display:flex;justify-content:space-between;padding:4px 0}
@media (min-width:900px){.top{display:none}nav{display:block;position:fixed;top:0;bottom:0;left:0;width:240px;padding:20px 12px}main{margin-left:260px;max-width:none;padding:28px 32px}.st{grid-template-columns:repeat(3,1fr)}.mo{align-items:center}.sh{border-radius:22px}.kv{grid-template-columns:repeat(3,1fr)}}
@media print{body>*:not(#md){display:none!important}.mo{position:static;background:#fff;display:block}.sh{max-height:none;overflow:visible;background:#fff;padding:0}.nop{display:none!important}#inv{border:0}}
</style></head><body>

function bad(v){return Math.floor(Date.now()/1000)<lock}
function loginView(){$("#app").innerHTML='<div class="lg"><div class="cd"><img src="'+LOGO+'" alt=""><h1 style="margin:12px 0 4px">Cowartu Admin</h1><p class="mu" style="margin:0 0 16px">Authorised team only</p><div class="fl"><input id="le" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><div class="er" id="lx"></div><button class="bt" id="lb">Sign in</button></div></div></div>';
 $("#lp").onkeydown=function(e){if(e.key=="Enter")$("#lb").click()};
